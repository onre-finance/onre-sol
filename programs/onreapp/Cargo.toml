[package]
name = "onreapp"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "onreapp"

[features]
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
mainnet-test = []
devnet-test = []
devnet-dev = []



[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = "=1.2.2"
bytemuck = { version = "1.25.2", features = ["min_const_generics"] }
cfg-if = "1.0.5"
solana-program = "4.1.0"
solana-security-txt = "1.1.3"
solana-instructions-sysvar = "5.0.0"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
spl-token-2022 = { version = "12.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
# LiteSVM 0.18 targets Agave 4.3; 4.4 changes its runtime APIs.
solana-builtins = "=4.3.2"
litesvm = { version = "0.18.1", features = ["precompiles", "register-tracing"] }
solana-compute-budget-interface = "3.1.0"
solana-sdk = "4.1.0"
