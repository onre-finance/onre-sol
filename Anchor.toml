[toolchain]
anchor_version = "1.2.2"
solana_version = "4.1.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
onreapp = "onreuGhHHgVzMWSkj2oQDLDtvvGvoepBPkqyaubFcwe"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "anchor build && cargo test --manifest-path programs/onreapp/Cargo.toml --tests"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = true

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8899
